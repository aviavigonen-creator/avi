<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="description" content="מארזי משלוח מנות לפורים בכשרות בד״ץ מהדרין. משלוח עד הבית.">
<title>מנות של פורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Assistant:wght@400;600;700&display=swap">
<style>
/* ===== מערכת עיצוב בהשראת חנות ממתקים: לבן, שוקולד, טורקיז, תכלת שמיים ===== */
:root{
  --bg:#ffffff; --surface:#ffffff; --cream:#faf6e1; --ink:#5f1315; --ink-soft:rgba(95,19,21,.7); --muted:#7a5a5c;
  --line:#efe6e6; --teal:#47c1bf; --teal-dark:#2ea3a1; --sky:#5fc3f5; --sky-deep:#2a9fe0; --navy:#230051;
  --yellow:#ffd93b; --pink:#ff5fa2; --choco:#5a2a16; --choco-dark:#3d1a0c; --ok:#1f7a5c;
  --display:"Varela Round","Assistant",Arial,sans-serif; --body:"Varela Round","Assistant",Arial,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;top:-100px;right:16px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:0 0 10px 10px;z-index:100;text-decoration:none}
.skip:focus{top:0}

/* ticker */
.ticker{background:var(--yellow);color:var(--ink);font-size:.85rem;overflow:hidden;white-space:nowrap;padding:5px 0}
.ticker-in{display:inline-block;padding-inline-start:100%;animation:tick 28s linear infinite}
.ticker-in span{margin-inline-end:48px}
@keyframes tick{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.ticker-in{animation:none;padding:0 16px;white-space:normal}}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--surface);box-shadow:0 2px 12px rgba(95,19,21,.08)}
.hdr .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:8px;min-height:62px}
.hdr .side{display:flex;align-items:center;gap:8px}
.hdr .side.l{justify-content:flex-start}
.hdr .side.r{justify-content:flex-end}
.logo{text-decoration:none;text-align:center;line-height:1}
.logo b{display:block;font-family:var(--display);font-size:1.7rem;letter-spacing:-.01em;background:linear-gradient(90deg,var(--pink),var(--sky-deep),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.logo small{display:block;font-size:.65rem;color:var(--ink-soft);margin-top:3px;letter-spacing:.08em}
.pill-btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:.9rem}
.pill-btn svg{width:20px;height:20px}
.pill-btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.cart-n{background:var(--pink);color:#fff;border-radius:999px;font-size:.72rem;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;border:2px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:#fff;min-width:0}
.search input{border:0;background:none;outline:0;width:150px;min-width:0}
.search button{border:0;background:var(--teal);color:#fff;border-radius:999px;width:30px;height:30px;display:grid;place-items:center}
@media (max-width:760px){.hdr .wrap{grid-template-columns:auto 1fr auto}.search input{width:90px}.hide-m{display:none!important}}

/* category strip */
.cats{border-bottom:1px solid var(--line);background:#fff}
.cats .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;display:grid;justify-items:center;gap:6px;background:none;border:0;padding:6px 10px;border-radius:14px;color:var(--ink);font-size:.78rem;width:84px}
.cat i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-style:normal;background:var(--cream);border:2px solid transparent;transition:transform .15s}
.cat[aria-pressed="true"] i{border-color:var(--teal);background:#e6f8f7}
.cat:hover i{transform:translateY(-2px)}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#8fd6f8 0%,var(--sky) 55%,#3fb0ec 100%);color:#fff;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.85;z-index:-1}
.hero::before{width:220px;height:90px;left:6%;top:22%;box-shadow:60px 20px 0 10px #fff,-40px 25px 0 -5px #fff}
.hero::after{width:180px;height:70px;right:8%;top:14%;box-shadow:50px 18px 0 6px #fff,-50px 22px 0 -8px #fff}
.drip{position:absolute;top:-2px;left:0;right:0;width:100%;height:auto;z-index:1}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding-block:120px 48px}
.hero h1{font-size:clamp(2rem,5.2vw,3.6rem);color:#fff;text-shadow:0 3px 0 rgba(42,159,224,.6),0 6px 18px rgba(0,0,0,.18)}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p{font-size:1.1rem;max-width:34em;margin:12px 0 18px;color:#f3fbff}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-size:1rem;text-decoration:none;background:var(--ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:rgba(255,255,255,.2);border:2px solid #fff;box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:none}
.seal{justify-self:center;width:min(300px,70vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0 58%,var(--yellow) 59% 70%,#fff 71%);display:grid;place-items:center;text-align:center;color:var(--ink);box-shadow:0 20px 40px rgba(0,0,0,.2);transform:rotate(-6deg)}
.seal div{display:grid;gap:4px}
.seal small{font-size:.8rem;letter-spacing:.14em}
.seal strong{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.05}
.seal .cnt{font-size:.9rem;color:var(--ink-soft)}
.seal .cnt b{color:var(--pink);font-size:1.3rem}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr;padding-block:96px 36px;text-align:center}.hero-cta{justify-content:center}.hero p{margin-inline:auto}}

/* sections */
section{padding-block:40px}
.sec-h{text-align:center;margin-bottom:22px;display:grid;gap:8px;justify-items:center}
.sec-h h2{font-size:clamp(1.5rem,3.4vw,2.2rem)}
.sec-h h2 span{color:var(--teal)}
.sec-h::after{content:"";width:120px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--teal))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(95,19,21,.12)}
.card .img{aspect-ratio:1;display:grid;place-items:center;overflow:hidden;position:relative;background:var(--cream)}
.card .img img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(60,20,10,.25))}
.card .img video{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;right:10px;background:var(--pink);color:#fff;font-size:.72rem;border-radius:999px;padding:3px 10px;z-index:1}
.badge.kos{right:auto;left:10px;top:auto;bottom:10px;background:#fff;color:var(--ok);border:1px solid var(--line)}
.card .b{padding:12px;display:grid;gap:8px;text-align:center;flex:1;align-content:start}
.card h3{font-size:.98rem;min-height:2.4em;display:grid;place-items:center}
.card .price{font-size:1.15rem;font-variant-numeric:tabular-nums}
.card .act{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:auto}
.card .more{border:2px solid var(--cream);background:var(--cream);color:var(--ink);border-radius:10px;padding:8px;font-size:.85rem}
.card .plus{border:0;background:var(--teal);color:#fff;border-radius:10px;width:40px;font-size:1.3rem;line-height:1}
.card .plus:hover{background:var(--teal-dark)}
.soldout{color:var(--muted);font-size:.85rem;border:1px dashed var(--line);border-radius:10px;padding:8px}
.sides{position:absolute;top:10px;left:10px;display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px;z-index:1}
.sides button{border:0;background:none;font-size:.72rem;border-radius:999px;padding:3px 8px;color:var(--ink)}
.sides button[aria-pressed="true"]{background:var(--teal);color:#fff}
.center{display:flex;justify-content:center;margin-top:22px}
.empty{text-align:center;color:var(--muted);padding:30px}

/* promo banners */
.promos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.promo{border-radius:var(--r);padding:22px;color:#fff;display:grid;gap:8px;align-content:center;min-height:150px;position:relative;overflow:hidden;text-decoration:none}
.promo h3{font-size:1.35rem}
.promo p{margin:0;opacity:.95}
.promo.p1{background:linear-gradient(135deg,var(--pink),#ff9a62)}
.promo.p2{background:linear-gradient(135deg,var(--sky-deep),var(--teal))}
.promo.p3{background:linear-gradient(135deg,var(--navy),#6a3fb5)}
.promo .emo{position:absolute;left:14px;bottom:8px;font-size:3.4rem;opacity:.9}

/* testimonials */
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.quote{background:#e9f8e7;border-radius:16px 16px 16px 4px;padding:14px 16px;font-size:.95rem;position:relative;color:#1e3a2a}
.quote small{display:block;color:#4b6a55;margin-top:8px;font-size:.78rem;text-align:left}
.ex{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px}

/* brands */
.brands{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.brand{background:var(--cream);border-radius:999px;padding:8px 18px;font-size:.95rem}

/* discounts */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:760px;margin:0 auto}
.tier{background:var(--cream);border-radius:16px;padding:16px;text-align:center}
.tier b{display:block;font-size:1.6rem;color:var(--teal-dark)}
.tier span{font-size:.85rem;color:var(--ink-soft)}

/* a11y statement */
.a11y-page{max-width:720px}
.a11y-page ul{padding-right:20px}

/* footer */
footer{position:relative;background:linear-gradient(180deg,#7fd0f7,#3fb0ec);color:#fff;overflow:hidden;margin-top:30px}
footer::before{content:"";position:absolute;width:260px;height:100px;border-radius:50%;background:#fff;opacity:.9;left:5%;top:30px;box-shadow:70px 25px 0 12px #fff,-50px 30px 0 -6px #fff,520px 160px 0 20px #fff,640px 120px 0 -4px #fff}
footer .wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-block:44px 30px}
footer h3{font-size:1.1rem;margin-bottom:8px}
footer nav{display:grid;gap:4px}
footer a{color:#fff;text-decoration:none}
footer a:hover{text-decoration:underline}
.socials{display:flex;gap:10px;margin-top:10px}
.socials a{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--sky-deep);display:grid;place-items:center}
.copy{position:relative;text-align:center;font-size:.8rem;padding:10px;background:rgba(0,0,0,.12)}
@media (max-width:640px){footer .wrap{grid-template-columns:1fr}}

/* floating */
.wa-float{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:40}
.wa-float svg{width:32px;height:32px}
.a11y-btn{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:#1559c9;color:#fff;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:40;display:grid;place-items:center;padding:0}
.a11y-btn svg{width:30px;height:30px}
.a11y{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 28px));background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:41;padding:14px;display:grid;gap:8px;max-height:calc(100vh - 110px);overflow-y:auto}
.a11y h2{font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.a11y .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--cream);color:var(--ink);text-align:right;width:100%}
.a11y .opt[aria-pressed="true"]{border-color:#1559c9;box-shadow:inset 0 0 0 2px #1559c9}
.a11y .opt .st{font-size:.8rem;color:var(--muted)}
.a11y .opt[aria-pressed="true"] .st{color:#0d47a1}
.a11y .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.x{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:1.1rem}

/* drawer */
.drawer{position:fixed;inset:0;background:rgba(40,10,10,.5);z-index:50;display:flex;justify-content:flex-start}
.panel{background:#fff;width:min(440px,100%);height:100%;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.panel header{display:flex;justify-content:space-between;align-items:center}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff}
.qty span{min-width:26px;text-align:center}
.sum{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:1.3rem;border-top:2px solid var(--ink);padding-top:6px;margin-top:4px}
.sum .disc{color:var(--ok)}
form{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:.9rem}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.submit{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:13px;font-size:1.05rem}
.done{background:var(--cream);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.done pre{white-space:pre-wrap;font-family:inherit;margin:0;background:#fff;border-radius:10px;padding:12px;border:1px solid var(--line)}
.paybtn{display:block;text-align:center;background:#1559c9;color:#fff;border-radius:12px;padding:13px;text-decoration:none;font-size:1.05rem}
.paybtn[aria-disabled="true"]{background:var(--muted);pointer-events:none;opacity:.75}
.cp{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px}
.terms-note{font-size:.85rem;color:var(--muted);margin:0}
.terms-note a{color:#1559c9}
.banner{background:var(--yellow);color:var(--ink);text-align:center;padding:10px 16px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(40,10,10,.6);z-index:60;display:grid;place-items:center;padding:16px}
.modal-in{background:#fff;color:var(--ink);border-radius:22px;padding:26px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);display:grid;gap:12px;max-height:calc(100vh - 40px);overflow-y:auto}
.modal-ico{font-size:2.6rem;line-height:1}
.modal-in h2{font-size:1.5rem}
.modal-in p{margin:0;font-size:1.05rem}
.modal-actions{display:grid;gap:8px;margin-top:6px}
.x-text{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px}
.pm-img{width:min(260px,60vw);margin:0 auto}
.pm-list{text-align:right;margin:0;padding-right:20px;color:var(--ink-soft)}

.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:70}

/* a11y modes */
html.a-big{font-size:118%} html.a-bigger{font-size:136%}
html.a-contrast{filter:contrast(1.25)}
html.a-contrast body,html.a-contrast .hdr,html.a-contrast .card,html.a-contrast .panel,html.a-contrast .a11y,html.a-contrast .modal-in,html.a-contrast .cats,html.a-contrast .tier,html.a-contrast .brand,html.a-contrast .quote{background:#000!important;color:#fff!important;border-color:#fff!important}
html.a-contrast .hero,html.a-contrast footer{background:#000!important}
html.a-contrast .hero::before,html.a-contrast .hero::after,html.a-contrast footer::before{display:none}
html.a-contrast .btn,html.a-contrast .submit,html.a-contrast .plus,html.a-contrast .more{background:#ff0!important;color:#000!important}
html.a-contrast :focus-visible{outline:4px solid #ff0}
html.a-links a,html.a-links button:not(.a11y-btn){text-decoration:underline!important;text-underline-offset:3px}
html.a-motion *,html.a-motion *::before,html.a-motion *::after{animation:none!important;transition:none!important}
html.a-font body,html.a-font h1,html.a-font h2,html.a-font h3,html.a-font .logo b{font-family:Arial,"Segoe UI",sans-serif!important}
html.a-gray{filter:grayscale(1)}
html.a-contrast.a-gray{filter:grayscale(1) contrast(1.25)}
html.a-cursor,html.a-cursor *{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 24 24'><path d='M4 2l14 10-6 1 4 7-3 1-4-7-5 4z' fill='%23000' stroke='%23fff' stroke-width='1.5'/></svg>") 4 2,auto!important}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=9"></script>
<script src="images.js?v=9"></script>
<script src="store.js?v=9"></script>
</body>
</html>
